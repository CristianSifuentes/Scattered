<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
  <title>Scattered</title>
  <defs>
    <radialGradient id="bg" cx="22%" cy="45%" r="95%">
      <stop offset="0" stop-color="#141d3d"/>
      <stop offset="0.6" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#060914"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0.3" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="920" height="260" rx="28" fill="url(#bg)"/>

  <!-- scattered dust -->
  <g opacity="0.55">
    <circle cx="300" cy="38" r="1.2" fill="#22d3ee"/><circle cx="412" cy="226" r="1" fill="#94a3b8"/>
    <circle cx="538" cy="30" r="1.4" fill="#a78bfa"/><circle cx="655" cy="232" r="1.2" fill="#f472b6"/>
    <circle cx="742" cy="44" r="1" fill="#94a3b8"/><circle cx="868" cy="62" r="1.5" fill="#f472b6"/>
    <circle cx="884" cy="204" r="1" fill="#22d3ee"/><circle cx="808" cy="222" r="1.3" fill="#a78bfa"/>
    <circle cx="346" cy="214" r="1.3" fill="#34d399"/><circle cx="470" cy="48" r="1" fill="#94a3b8"/>
    <circle cx="610" cy="52" r="1" fill="#34d399"/><circle cx="36" cy="40" r="1.2" fill="#94a3b8"/>
    <circle cx="48" cy="222" r="1" fill="#22d3ee"/><circle cx="252" cy="232" r="1.2" fill="#fbbf24"/>
  </g>

  <!-- emblem: a hub and the services scattered around it -->
  <g fill="none" stroke-linecap="round">
    <circle cx="140" cy="130" r="74" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 8">
      <animateTransform attributeName="transform" type="rotate" from="0 140 130" to="360 140 130" dur="40s" repeatCount="indefinite"/>
    </circle>
    <path d="M140 130 L84 70" stroke="#22d3ee" stroke-width="2.2"/>
    <path d="M140 130 L214 82" stroke="#fbbf24" stroke-width="2.2"/>
    <path d="M140 130 L226 158" stroke="#f472b6" stroke-width="2.2"/>
    <path d="M140 130 L150 214" stroke="#34d399" stroke-width="2.2"/>
    <path d="M140 130 L62 172" stroke="#60a5fa" stroke-width="2.2"/>
    <path d="M84 70 Q150 40 214 82" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 5"/>
    <path d="M226 158 Q204 204 150 214" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 5"/>
    <path d="M62 172 Q52 112 84 70" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 5"/>
  </g>
  <circle cx="140" cy="130" r="46" fill="url(#halo)"/>
  <circle cx="140" cy="130" r="22" fill="#0a1024" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="140" cy="130" r="9" fill="#a78bfa"/>
  <g stroke-width="2.6" fill="#0a1024">
    <circle cx="84" cy="70" r="13" stroke="#22d3ee"/>
    <circle cx="214" cy="82" r="10" stroke="#fbbf24"/>
    <circle cx="226" cy="158" r="14" stroke="#f472b6"/>
    <circle cx="150" cy="214" r="11" stroke="#34d399"/>
    <circle cx="62" cy="172" r="9" stroke="#60a5fa"/>
  </g>
  <circle cx="84" cy="70" r="5" fill="#22d3ee"/>
  <circle cx="214" cy="82" r="3.6" fill="#fbbf24"/>
  <circle cx="226" cy="158" r="5.5" fill="#f472b6"/>
  <circle cx="150" cy="214" r="4" fill="#34d399"/>
  <circle cx="62" cy="172" r="3.2" fill="#60a5fa"/>
  <!-- messages travelling to the hub -->
  <circle r="3" fill="#ffffff"><animateMotion dur="2.6s" repeatCount="indefinite" path="M84 70 L140 130"/></circle>
  <circle r="3" fill="#ffffff"><animateMotion dur="3.2s" begin="-1s" repeatCount="indefinite" path="M140 130 L226 158"/></circle>
  <circle r="3" fill="#ffffff"><animateMotion dur="2.9s" begin="-2s" repeatCount="indefinite" path="M140 130 L150 214"/></circle>

  <!-- wordmark -->
  <text x="290" y="150" font-size="92" font-weight="800" fill="url(#word)" textLength="580" lengthAdjust="spacingAndGlyphs">SCATTERED</text>
  <rect x="292" y="174" width="64" height="4" rx="2" fill="#22d3ee"/>
  <text x="372" y="182" font-size="17" fill="#94a3b8" letter-spacing="3.5" textLength="498" lengthAdjust="spacing">SISTEMAS DISTRIBUIDOS CON .NET · PASO A PASO</text>
</svg>
