<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" width="1400" height="1090" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Scattered - Arquitectura (features/flow1 · 01-Introduccion)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="svc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <g id="db">
      <path d="M0 10 v50 a100 10 0 0 0 200 0 v-50" fill="#131c31" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
      <ellipse cx="100" cy="10" rx="100" ry="10" fill="#1a2438" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
    </g>
  </defs>

  <style>
    .plan { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; stroke-linejoin: round; marker-end: url(#arrow); }
    .plan-join { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; stroke-linejoin: round; }
    .gateway { fill: #1a1f3d; stroke: #818cf8; stroke-width: 2; }
    .gateway-title { fill: #e0e7ff; font-size: 18px; font-weight: 600; }
    .endpoint { fill: #312e81; stroke: #818cf8; stroke-width: 1.5; }
    .endpoint-text { fill: #eef2ff; font-size: 15px; text-anchor: middle; }
    .planned { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .planned-text { fill: #94a3b8; font-size: 15px; text-anchor: middle; }
    .service { fill: url(#svc); stroke: #22d3ee; stroke-width: 2; }
    .service-text { fill: #ecfeff; font-size: 17px; font-weight: 600; text-anchor: middle; }
    .code { fill: #a5f3fc; font-size: 13px; text-anchor: middle; font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
    .db-text { fill: #94a3b8; font-size: 15px; text-anchor: middle; }
    .external { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; }
    .tag { fill: #fbbf24; }
    .tag-next { fill: #475569; }
    .tag-text { fill: #1c1917; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .tag-next-text { fill: #e2e8f0; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .panel { fill: #131c31; stroke: #334155; stroke-width: 1.5; }
    .card { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
    .card-text { fill: #e2e8f0; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .card-note { fill: #cbd5e1; font-size: 13px; text-anchor: middle; }
    .muted { fill: #94a3b8; }
    .legend { fill: #cbd5e1; font-size: 13px; }
  </style>

  <rect width="1400" height="1090" rx="18" fill="#0f172a"/>
  <text x="40" y="50" fill="#f8fafc" font-size="24" font-weight="700">Scattered</text>
  <text x="158" y="50" fill="#94a3b8" font-size="16">arquitectura · features/flow1 (01-Introduccion): esqueleto inicial</text>

  <!-- Leyenda -->
  <rect x="40" y="72" width="34" height="20" rx="5" class="service"/>
  <text class="legend" x="82" y="87">Existe en el código (esqueleto)</text>
  <rect x="300" y="72" width="34" height="20" rx="5" class="planned"/>
  <text class="legend" x="342" y="87">Planificado: todavía no existe</text>
  <rect class="tag" x="560" y="71" width="80" height="22" rx="11"/>
  <text class="tag-text" x="600" y="86">Hecho</text>
  <text class="legend" x="648" y="87">Implementado en esta rama</text>
  <rect class="tag-next" x="840" y="71" width="80" height="22" rx="11"/>
  <text class="tag-next-text" x="880" y="86">cap. N</text>
  <text class="legend" x="928" y="87">Llega en un capítulo posterior</text>

  <!-- Conexiones planificadas (ninguna existe aún) -->
  <path class="plan" d="M340 288 H400 V175 H560"/>
  <path class="plan-join" d="M340 342 H400 V288"/>
  <path class="plan" d="M340 406 H560"/>
  <path class="plan" d="M340 470 H450 V540 H560"/>
  <path class="plan-join" d="M340 524 H450"/>
  <path class="plan" d="M340 754 H710 V590"/>
  <path class="plan" d="M710 220 V260"/>
  <path class="plan" d="M710 490 V460"/>
  <path class="plan" d="M860 440 H890 V510 H860"/>
  <path class="plan" d="M860 530 H940 V310 H860"/>
  <path class="plan" d="M860 175 H1120"/>
  <path class="plan" d="M860 295 H1120"/>
  <path class="plan" d="M860 405 H1120"/>
  <path class="plan" d="M860 570 H1040 V500 H1120"/>
  <path class="plan" d="M1040 570 V590 H1120"/>
  <path class="plan" d="M800 590 V685 H1120"/>
  <path class="plan" d="M760 590 V800 H1100"/>

  <!-- Public API -->
  <rect class="gateway" x="40" y="120" width="320" height="440" rx="16"/>
  <text class="gateway-title" x="62" y="155">public facing API</text>
  <rect class="tag" x="62" y="170" width="86" height="24" rx="12"/>
  <text class="tag-text" x="105" y="186">Minimal API</text>
  <rect class="tag-next" x="156" y="170" width="142" height="24" rx="12"/>
  <text class="tag-next-text" x="227" y="186">Api Gateway · cap. 2</text>

  <rect class="endpoint" x="70" y="210" width="270" height="44" rx="22"/>
  <text class="endpoint-text" x="205" y="237">GET /  →  "Hello World!"</text>
  <rect class="planned" x="70" y="266" width="270" height="44" rx="22"/>
  <text class="planned-text" x="205" y="293">Suscribirse</text>
  <rect class="planned" x="70" y="320" width="270" height="44" rx="22"/>
  <text class="planned-text" x="205" y="347">unsuscribe</text>
  <rect class="planned" x="70" y="384" width="270" height="44" rx="22"/>
  <text class="planned-text" x="205" y="411">Update product</text>
  <rect class="planned" x="70" y="448" width="270" height="44" rx="22"/>
  <text class="planned-text" x="205" y="475">Create order</text>
  <rect class="planned" x="70" y="502" width="270" height="44" rx="22"/>
  <text class="planned-text" x="205" y="529">GetOrder</text>

  <!-- Private API -->
  <rect class="gateway" x="40" y="590" width="320" height="200" rx="16"/>
  <text class="gateway-title" x="62" y="625">Private api for Tenants</text>
  <rect class="tag" x="62" y="640" width="86" height="24" rx="12"/>
  <text class="tag-text" x="105" y="656">Minimal API</text>
  <rect class="tag-next" x="156" y="640" width="142" height="24" rx="12"/>
  <text class="tag-next-text" x="227" y="656">Api Gateway · cap. 2</text>

  <rect class="endpoint" x="70" y="676" width="270" height="44" rx="22"/>
  <text class="endpoint-text" x="205" y="703">GET /  →  "Hello World!"</text>
  <rect class="planned" x="70" y="732" width="270" height="44" rx="22"/>
  <text class="planned-text" x="205" y="759">Reports?</text>

  <!-- Microservicios: existen, con endpoints que devuelven datos fijos -->
  <rect class="service" x="560" y="130" width="300" height="90" rx="12"/>
  <text class="service-text" x="710" y="160">Subscription Microservice</text>
  <text class="code" x="710" y="184">POST /subscription → true</text>
  <text class="code" x="710" y="204">DELETE /subscription → true</text>
  <rect class="tag" x="796" y="118" width="64" height="24" rx="12"/>
  <text class="tag-text" x="828" y="134">Web API</text>

  <rect class="service" x="560" y="260" width="300" height="70" rx="12"/>
  <text class="service-text" x="710" y="290">Email Microservice</text>
  <text class="code" x="710" y="314">POST /email → true</text>
  <rect class="tag" x="796" y="248" width="64" height="24" rx="12"/>
  <text class="tag-text" x="828" y="264">Web API</text>

  <rect class="service" x="560" y="370" width="300" height="90" rx="12"/>
  <text class="service-text" x="710" y="400">Products Microservice</text>
  <text class="code" x="710" y="424">GET /product/{id} → "TODO"</text>
  <text class="code" x="710" y="444">POST /product → true</text>
  <rect class="tag" x="796" y="358" width="64" height="24" rx="12"/>
  <text class="tag-text" x="828" y="374">Web API</text>

  <rect class="service" x="560" y="490" width="300" height="100" rx="12"/>
  <text class="service-text" x="710" y="522">Orders Microservice</text>
  <text class="code" x="710" y="546">GET /order/{id} → mismo id</text>
  <text class="code" x="710" y="566">POST /order → Guid nuevo</text>
  <rect class="tag" x="796" y="478" width="64" height="24" rx="12"/>
  <text class="tag-text" x="828" y="494">Web API</text>

  <rect class="tag-next" x="412" y="163" width="140" height="24" rx="12"/>
  <text class="tag-next-text" x="482" y="179">RabbitMQ · cap. 3-4</text>

  <!-- Almacenamiento y externos: planificados -->
  <use href="#db" x="1120" y="140"/>
  <text class="db-text" x="1220" y="187">subs DB</text>
  <use href="#db" x="1120" y="260"/>
  <text class="db-text" x="1220" y="307">Vault (secrets)</text>
  <rect class="tag-next" x="1180" y="232" width="80" height="22" rx="11"/>
  <text class="tag-next-text" x="1220" y="247">cap. 5</text>
  <use href="#db" x="1120" y="370"/>
  <text class="db-text" x="1220" y="417">products Db</text>
  <use href="#db" x="1120" y="465"/>
  <text class="db-text" x="1220" y="512">Orders Db write</text>
  <use href="#db" x="1120" y="555"/>
  <text class="db-text" x="1220" y="602">Orders Db read</text>
  <use href="#db" x="1120" y="650"/>
  <text class="db-text" x="1220" y="697">Redis</text>

  <rect class="external" x="1100" y="760" width="250" height="80" rx="12"/>
  <text class="db-text" x="1225" y="786">3rd party api</text>
  <text class="db-text" x="1225" y="806">when the product is</text>
  <text class="db-text" x="1225" y="826">not managed by us</text>

  <!-- Común: src/Shared -->
  <rect class="panel" x="40" y="860" width="1320" height="200" rx="16"/>
  <text x="62" y="892" fill="#f8fafc" font-size="18" font-weight="600">Común</text>
  <text x="132" y="892" fill="#94a3b8" font-size="14">src/Shared · lo usan los 6 proyectos ejecutables</text>

  <rect class="card" x="60" y="910" width="420" height="130" rx="12"/>
  <text class="card-text" x="270" y="942">Scattered.Shared.Api</text>
  <rect class="tag" x="160" y="955" width="220" height="24" rx="12"/>
  <text class="tag-text" x="270" y="971">DefaultScatteredWebApplication</text>
  <text class="card-note" x="270" y="1003">Create(): controllers + Swagger + extensión opcional</text>
  <text class="card-note" x="270" y="1023">Run(): Swagger, HTTPS, autorización, MapControllers</text>

  <rect class="card" x="500" y="910" width="300" height="130" rx="12"/>
  <text class="card-text" x="650" y="942">Scattered.Shared.Setup</text>
  <rect class="tag" x="592" y="955" width="116" height="24" rx="12"/>
  <text class="tag-text" x="650" y="971">GlobalUsings.cs</text>
  <text class="code" x="650" y="1003">global using Scattered.Shared.Api;</text>
  <text class="card-note" x="650" y="1023">enlazado en cada proyecto</text>

  <rect class="planned" x="820" y="910" width="250" height="130" rx="12"/>
  <text class="card-text muted" x="945" y="942">Service bus</text>
  <rect class="tag-next" x="875" y="955" width="140" height="24" rx="12"/>
  <text class="tag-next-text" x="945" y="971">RabbitMQ · cap. 3-4</text>
  <text class="card-note muted" x="945" y="1003">definido en docker-compose.yaml</text>
  <text class="card-note muted" x="945" y="1023">ningún servicio lo usa todavía</text>

  <rect class="planned" x="1090" y="910" width="250" height="130" rx="12"/>
  <text class="card-text muted" x="1215" y="942">Resto de la plataforma</text>
  <rect class="tag-next" x="1150" y="955" width="130" height="24" rx="12"/>
  <text class="tag-next-text" x="1215" y="971">cap. 5 en adelante</text>
  <text class="card-note muted" x="1215" y="1003">Vault, Consul, Graylog,</text>
  <text class="card-note muted" x="1215" y="1023">OpenTelemetry, Zipkin…</text>
</svg>
