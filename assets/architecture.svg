<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1105" width="1400" height="1105" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Scattered - Arquitectura</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c8"/>
    </marker>
    <linearGradient id="svc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <g id="db">
      <path d="M0 10 v50 a100 10 0 0 0 200 0 v-50" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
      <ellipse cx="100" cy="10" rx="100" ry="10" fill="#273449" stroke="#60a5fa" stroke-width="2"/>
    </g>
  </defs>

  <style>
    .line { fill: none; stroke: #9fb0c8; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
    .join { fill: none; stroke: #9fb0c8; stroke-width: 2; stroke-linejoin: round; }
    .async { stroke-dasharray: 8 6; }
    .gateway { fill: #1a1f3d; stroke: #818cf8; stroke-width: 2; }
    .gateway-title { fill: #e0e7ff; font-size: 18px; font-weight: 600; }
    .endpoint { fill: #312e81; stroke: #818cf8; stroke-width: 1.5; }
    .endpoint-text { fill: #eef2ff; font-size: 15px; text-anchor: middle; }
    .service { fill: url(#svc); stroke: #22d3ee; stroke-width: 2; }
    .service-text { fill: #ecfeff; font-size: 17px; font-weight: 600; text-anchor: middle; }
    .db-text { fill: #dbeafe; font-size: 15px; text-anchor: middle; }
    .external { fill: #3b1d2a; stroke: #fb7185; stroke-width: 2; stroke-dasharray: 4 4; }
    .external-text { fill: #ffe4e6; font-size: 14px; text-anchor: middle; }
    .tag { fill: #fbbf24; }
    .tag-alt { fill: #34d399; }
    .tag-text { fill: #1c1917; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .panel { fill: #131c31; stroke: #334155; stroke-width: 1.5; }
    .card { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
    .card-text { fill: #e2e8f0; font-size: 15px; font-weight: 600; text-anchor: middle; }
  </style>

  <rect width="1400" height="1105" rx="18" fill="#0f172a"/>
  <text x="40" y="52" fill="#f8fafc" font-size="24" font-weight="700">Scattered</text>
  <text x="158" y="52" fill="#94a3b8" font-size="16">arquitectura del sistema distribuido</text>

  <!-- Connections -->
  <path class="line async" d="M340 182 H560"/>
  <path class="join async" d="M340 236 H385 V182"/>
  <path class="line" d="M860 182 H1120"/>
  <path class="line" d="M710 217 V255"/>
  <path class="line" d="M340 310 H440 V398 H560"/>
  <path class="join" d="M340 364 H440"/>
  <path class="line async" d="M340 438 H490 V550 H560"/>
  <path class="line" d="M340 492 H440 V580 H560"/>
  <path class="line" d="M340 712 H640 V615"/>
  <path class="line" d="M710 515 V433"/>
  <path class="line async" d="M860 415 H890 V535 H860"/>
  <path class="line" d="M860 555 H980 V290 H860"/>
  <path class="line" d="M860 390 H1040 V345 H1120"/>
  <path class="line" d="M1040 390 V435 H1120"/>
  <path class="line" d="M860 590 H1120"/>
  <path class="line" d="M780 615 V705 H1120"/>
  <path class="line" d="M740 615 V820 H1100"/>

  <!-- Public API gateway -->
  <rect class="gateway" x="40" y="90" width="320" height="450" rx="16"/>
  <text class="gateway-title" x="62" y="127">public facing API</text>
  <rect class="tag" x="250" y="110" width="94" height="24" rx="12"/>
  <text class="tag-text" x="297" y="126">Api Gateway</text>

  <rect class="endpoint" x="70" y="160" width="270" height="44" rx="22"/>
  <text class="endpoint-text" x="205" y="187">Suscribirse</text>
  <rect class="endpoint" x="70" y="214" width="270" height="44" rx="22"/>
  <text class="endpoint-text" x="205" y="241">unsuscribe</text>
  <rect class="endpoint" x="70" y="288" width="270" height="44" rx="22"/>
  <text class="endpoint-text" x="205" y="315">Update product</text>
  <rect class="endpoint" x="70" y="342" width="270" height="44" rx="22"/>
  <text class="endpoint-text" x="205" y="369">Create product</text>
  <rect class="endpoint" x="70" y="416" width="270" height="44" rx="22"/>
  <text class="endpoint-text" x="205" y="443">Create order</text>
  <rect class="endpoint" x="70" y="470" width="270" height="44" rx="22"/>
  <text class="endpoint-text" x="205" y="497">GetOrder</text>

  <!-- Private API gateway -->
  <rect class="gateway" x="40" y="570" width="320" height="190" rx="16"/>
  <text class="gateway-title" x="62" y="606">Private api for Tenants</text>
  <rect class="tag" x="62" y="622" width="94" height="24" rx="12"/>
  <text class="tag-text" x="109" y="638">Api Gateway</text>
  <rect class="tag" x="164" y="622" width="66" height="24" rx="12"/>
  <text class="tag-text" x="197" y="638">Api Key</text>
  <rect class="tag-alt" x="238" y="622" width="100" height="24" rx="12"/>
  <text class="tag-text" x="288" y="638">Rate limiting</text>
  <rect class="endpoint" x="70" y="690" width="270" height="44" rx="22"/>
  <text class="endpoint-text" x="205" y="717">Reports?</text>

  <!-- Microservices -->
  <rect class="service" x="560" y="147" width="300" height="70" rx="12"/>
  <text class="service-text" x="710" y="188">Subscription Microservice</text>
  <rect class="service" x="560" y="255" width="300" height="70" rx="12"/>
  <text class="service-text" x="710" y="296">Email Microservice</text>
  <rect class="service" x="560" y="363" width="300" height="70" rx="12"/>
  <text class="service-text" x="710" y="404">Products Microservice</text>
  <rect class="service" x="560" y="515" width="300" height="100" rx="12"/>
  <text class="service-text" x="710" y="571">Orders Microservice</text>

  <!-- Data stores -->
  <use href="#db" x="1120" y="147"/>
  <text class="db-text" x="1220" y="194">subs DB</text>
  <use href="#db" x="1120" y="310"/>
  <text class="db-text" x="1220" y="357">products read Db</text>
  <use href="#db" x="1120" y="400"/>
  <text class="db-text" x="1220" y="447">products Write Db</text>
  <use href="#db" x="1120" y="555"/>
  <text class="db-text" x="1220" y="602">OrdersDb</text>
  <use href="#db" x="1120" y="670"/>
  <text class="db-text" x="1220" y="717">Distributed cache</text>

  <rect class="external" x="1100" y="780" width="250" height="80" rx="12"/>
  <text class="external-text" x="1225" y="806">3rd party api</text>
  <text class="external-text" x="1225" y="826">when the product is</text>
  <text class="external-text" x="1225" y="846">not managed by us</text>

  <!-- Pattern tags -->
  <rect class="tag" x="396" y="170" width="144" height="24" rx="12"/>
  <text class="tag-text" x="468" y="186">publisher · consumer</text>
  <rect class="tag" x="368" y="426" width="112" height="24" rx="12"/>
  <text class="tag-text" x="424" y="442">Event sourcing</text>
  <rect class="tag" x="574" y="351" width="56" height="24" rx="12"/>
  <text class="tag-text" x="602" y="367">CQRS</text>
  <rect class="tag" x="815" y="463" width="150" height="24" rx="12"/>
  <text class="tag-text" x="890" y="479">Eventual consistency</text>
  <rect class="tag" x="957" y="578" width="86" height="24" rx="12"/>
  <text class="tag-text" x="1000" y="594">Aggregate</text>

  <!-- Común -->
  <rect class="panel" x="40" y="900" width="1320" height="175" rx="16"/>
  <text x="62" y="932" fill="#f8fafc" font-size="18" font-weight="600">Común</text>

  <rect class="card" x="50" y="948" width="205" height="112" rx="12"/>
  <text class="card-text" x="152.5" y="984">Secret Store</text>
  <rect class="tag" x="118.5" y="1002" width="68" height="24" rx="12"/>
  <text class="tag-text" x="152.5" y="1018">Vault</text>

  <rect class="card" x="269" y="948" width="205" height="112" rx="12"/>
  <text class="card-text" x="371.5" y="984">Service discovery</text>
  <rect class="tag" x="333.5" y="1002" width="76" height="24" rx="12"/>
  <text class="tag-text" x="371.5" y="1018">Consul</text>

  <rect class="card" x="488" y="948" width="205" height="112" rx="12"/>
  <text class="card-text" x="590.5" y="984">Registro de logs</text>
  <rect class="tag" x="551.5" y="1002" width="78" height="24" rx="12"/>
  <text class="tag-text" x="590.5" y="1018">Graylog</text>

  <rect class="card" x="707" y="948" width="205" height="112" rx="12"/>
  <text class="card-text" x="809.5" y="984">Service bus</text>
  <rect class="tag" x="764.5" y="1002" width="90" height="24" rx="12"/>
  <text class="tag-text" x="809.5" y="1018">RabbitMQ</text>

  <rect class="card" x="926" y="948" width="205" height="112" rx="12"/>
  <text class="card-text" x="1028.5" y="980">Observabilidad</text>
  <rect class="tag" x="970.5" y="993" width="116" height="24" rx="12"/>
  <text class="tag-text" x="1028.5" y="1009">Opentelemetry</text>
  <rect class="tag" x="951.5" y="1023" width="154" height="24" rx="12"/>
  <text class="tag-text" x="1028.5" y="1039">Grafana &amp; Prometheus</text>

  <rect class="card" x="1145" y="948" width="205" height="112" rx="12"/>
  <text class="card-text" x="1247.5" y="984">Tracing Distribuido</text>
  <rect class="tag" x="1213.5" y="1002" width="68" height="24" rx="12"/>
  <text class="tag-text" x="1247.5" y="1018">Zipkin</text>
</svg>
