<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" width="1400" height="1090" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Scattered - Arquitectura (features/flow11 · 12-Saga)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c8"/>
    </marker>
    <marker id="arrow-discovery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-log" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f472b6"/>
    </marker>
    <marker id="arrow-secret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/>
    </marker>
    <linearGradient id="svc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <g id="db-live">
      <path d="M0 10 v50 a100 10 0 0 0 200 0 v-50" fill="#2e1065" stroke="#c084fc" stroke-width="2"/>
      <ellipse cx="100" cy="10" rx="100" ry="10" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
    </g>
    <g id="db-data">
      <path d="M0 10 v50 a100 10 0 0 0 200 0 v-50" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
      <ellipse cx="100" cy="10" rx="100" ry="10" fill="#075985" stroke="#38bdf8" stroke-width="2"/>
    </g>
    <g id="db">
      <path d="M0 10 v50 a100 10 0 0 0 200 0 v-50" fill="#131c31" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
      <ellipse cx="100" cy="10" rx="100" ry="10" fill="#1a2438" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
    </g>
  </defs>

  <style>
