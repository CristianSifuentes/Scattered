    .secret-live { fill: none; stroke: #c084fc; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow-secret); }
    .discovery-live { fill: none; stroke: #34d399; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow-discovery); }
    .log-live { fill: none; stroke: #f472b6; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow-log); }
    .logs { fill: #500724; stroke: #f472b6; stroke-width: 2; }
    .registry { fill: #022c22; stroke: #34d399; stroke-width: 2; }
    .line { fill: none; stroke: #9fb0c8; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow-live); }
