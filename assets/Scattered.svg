<svg xmlns="http://www.w3.org/2000/svg" width="440" height="120" viewBox="0 0 440 120" role="img" aria-labelledby="title">
  <title id="title">Scattered</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5A4"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Isotipo: nodos dispersos conectados a un núcleo -->
  <g transform="translate(14 10)">
    <g stroke="url(#brand)" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="50" y1="50" x2="18" y2="22"/>
      <line x1="50" y1="50" x2="86" y2="18"/>
      <line x1="50" y1="50" x2="92" y2="70"/>
      <line x1="50" y1="50" x2="28" y2="88"/>
      <line x1="86" y1="18" x2="92" y2="70"/>
    </g>
    <circle cx="50" cy="50" r="14" fill="url(#brand)"/>
    <circle cx="50" cy="50" r="5" fill="#ffffff"/>
    <circle cx="18" cy="22" r="8" fill="url(#brand)"/>
    <circle cx="86" cy="18" r="6" fill="url(#brand)"/>
    <circle cx="92" cy="70" r="9" fill="url(#brand)"/>
    <circle cx="28" cy="88" r="6.5" fill="url(#brand)"/>
    <circle cx="6" cy="62" r="3.5" fill="url(#brand)" opacity="0.7"/>
    <circle cx="66" cy="96" r="3" fill="url(#brand)" opacity="0.7"/>
  </g>

  <!-- Logotipo -->
  <text x="128" y="78" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1" fill="url(#word)">Scattered</text>
</svg>
